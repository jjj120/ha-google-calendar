services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: ha-google-calendar-dev
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Vienna}
    ports:
      - "8123:8123"
    volumes:
      # Persistent Home Assistant configuration, owned correctly inside the
      # container (avoids host UID/permission problems). Created on first boot
      # with onboarding.
      - ha_config:/config
      # Live-mount the custom integration so backend edits require only a
      # config-entry reload (Settings -> Devices & Services -> reload).
      # :z relabels for SELinux-enforcing hosts so the HA user can read them.
      # The bundled Lovelace card is served by the integration itself at
      # /local/ha-google-calendar-card.js, so no separate www mount is needed.
      - ./custom_components:/config/custom_components:z

volumes:
  ha_config:
