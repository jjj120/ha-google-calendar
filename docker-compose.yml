services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: ha-google-calendar-dev
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Vienna}
    ports:
      - "8123:8123"
    volumes:
      # Home Assistant configuration (generated on first boot / onboarding).
      - ./config:/config
      # Live-mount the custom integration so backend edits require only a
      # config-entry reload (Settings -> Devices & Services -> reload).
      - ./custom_components:/config/custom_components
      # Live-mount the built Lovelace card so it is served at /local/...
      - ./www:/config/www
