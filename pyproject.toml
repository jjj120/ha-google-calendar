[project]
name = "ha-google-calendar"
version = "0.1.0"
description = "Home Assistant integration exposing Google Calendar per-event colours"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".venv", "node_modules"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "I",    # import sorting
  "SIM",  # simplify
]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
